name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast gate: everything that does not need a running cluster.
  check:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # Several real-time lease tests use subsecond session deadlines.
        # Keep independent tests from competing for the runner's CPU.
        run: cargo test --workspace --locked -- --test-threads=1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dashboard behavior
        run: node --test scripts/test-dashboard.cjs
      - name: Benchmark resource accounting
        run: node --test scripts/test-bench-resources.cjs

  # The live suites: real brokers, real kills, real logs on disk. These are
  # what actually catch replication and recovery regressions, so they gate
  # merges rather than running on a schedule somewhere no one looks.
  verify:
    name: Live verification (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        suite:
          - verify-m1
          - verify-m3
          - verify-m4
          - verify-m6
          - verify-replication
          - verify-retention
          - verify-failures
          - verify-transport-parity
          - verify-m5
          - verify-reassignment
          - verify-admin-and-security
          - verify-transactions
          - verify-compaction
          - verify-jbod
          - verify-ws-gateway
          - verify-ws-fanout
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: |
          cargo build --locked -p brahmaputra-server -p brahmaputra-cli
          cargo build --locked --release -p brahmaputra-server -p brahmaputra-cli

      - name: ${{ matrix.suite }}
        run: bash scripts/${{ matrix.suite }}.sh
        env:
          STORM_GATE: "1"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-artifacts
          path: /tmp/brahmaputra-*
          if-no-files-found: ignore
          retention-days: 7

  # Every client driver's end-to-end suite against a live broker. Each
  # driver speaks the wire protocol natively, so a broker change that alters
  # an encoding shows up here as the driver that stopped agreeing.
  clients:
    name: Client driver (${{ matrix.driver }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        driver: [rust, go, nodejs, typescript, python, java, kotlin, scala,
                 dotnet, fsharp, cpp, c, d, php, ruby, perl, lua, erlang,
                 elixir, haskell, ocaml, crystal, nim, dart]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - if: matrix.driver == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - if: matrix.driver == 'nodejs' || matrix.driver == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.driver == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.driver == 'java' || matrix.driver == 'kotlin' || matrix.driver == 'scala'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.driver == 'dotnet' || matrix.driver == 'fsharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - if: matrix.driver == 'cpp' || matrix.driver == 'c'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev cmake
      # Toolchains Ubuntu packages directly (the versions these drivers
      # were verified with: LDC 1.36, Lua 5.4, GHC 9.4, OCaml 4.14,
      # Crystal 1.11, Nim 1.6).
      - if: matrix.driver == 'd'
        run: sudo apt-get update && sudo apt-get install -y ldc
      - if: matrix.driver == 'lua'
        run: sudo apt-get update && sudo apt-get install -y lua5.4 lua-socket lua-zlib
      - if: matrix.driver == 'haskell'
        run: |
          sudo apt-get update
          sudo apt-get install -y ghc libghc-network-dev libghc-zlib-dev libghc-stm-dev libghc-async-dev
          # The runner's own GHC (ghcup) comes first on PATH and cannot see
          # the apt-installed libraries; use the one that can.
          echo "GHC=/usr/bin/ghc" >> "$GITHUB_ENV"
      - if: matrix.driver == 'ocaml'
        run: sudo apt-get update && sudo apt-get install -y ocaml ocaml-findlib libzip-ocaml-dev
      - if: matrix.driver == 'crystal'
        run: sudo apt-get update && sudo apt-get install -y crystal
      - if: matrix.driver == 'nim'
        run: sudo apt-get update && sudo apt-get install -y nim
      - if: matrix.driver == 'dart'
        uses: dart-lang/setup-dart@v1
      - if: matrix.driver == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zlib, pcntl, posix
      - if: matrix.driver == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - if: matrix.driver == 'erlang' || matrix.driver == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: ${{ matrix.driver == 'elixir' && '1.16' || '' }}

      - name: Build broker
        run: cargo build --locked --release -p brahmaputra-server
      - name: ${{ matrix.driver }} end-to-end suite
        run: bash clients/run-e2e.sh ${{ matrix.driver }}
        env:
          # Trace the consumer-group protocol on both sides; printed only
          # when a suite fails, and by the C driver's rebalance checks.
          BROKER_LOG: info,brahmaputra_broker::group=debug
          BRP_DEBUG: ${{ matrix.driver == 'c' && '1' || '' }}

  # The UI SDKs end to end: UI -> WebSocket gateway -> Brahmaputra and
  # back. `browser` runs React, Vue and Angular apps in Chrome; `flutter`
  # pumps the Flutter widgets against a real gateway.
  ws-sdks:
    name: WebSocket SDK (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        suite: [js, browser, dart, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: matrix.suite == 'js' || matrix.suite == 'browser'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.suite == 'dart'
        uses: dart-lang/setup-dart@v1
      - if: matrix.suite == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: ${{ matrix.suite }} suite
        run: bash clients/ws/test.sh ${{ matrix.suite }}
        env:
          # The runner image ships Google Chrome; Playwright drives it.
          CHROMIUM: /usr/bin/google-chrome

  # Manual only (Actions > CI > Run workflow): hammer the C driver's
  # two-member rebalance, which has failed intermittently on runners. Saves
  # the driver's group trace and the broker's group log as artifacts.
  c-rebalance-stress:
    name: C rebalance stress (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build broker and harness
        run: |
          cargo build --locked --release -p brahmaputra-server
          make -C clients/c build/rebalance_stress
      - name: Stress
        run: |
          mkdir -p stress
          RUST_LOG=info,brahmaputra_broker::group=debug \
            target/release/brahmaputra-server --data-dir stress/data --default-partitions 4 \
            --port 19092 --http-port 18092 > stress/broker.log 2>&1 &
          for _ in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/19092) 2>/dev/null && break; sleep 0.2; done
          BRP_DEBUG=1 clients/c/build/rebalance_stress 127.0.0.1 19092 100 2> stress/trace.txt | tee stress/result.txt
          # And the whole suite a few times, as the failing job ran it.
          for i in 1 2 3; do
            BRP_DEBUG=1 bash clients/c/test.sh 127.0.0.1 19092 > "stress/suite-$i.txt" 2>&1 || echo "suite run $i failed"
            grep -E 'passed, [0-9]+ failed' "stress/suite-$i.txt" | tail -1
          done
          ! grep -q FAIL stress/result.txt stress/suite-*.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c-rebalance-stress
          path: stress/*.txt
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c-rebalance-stress-broker
          path: stress/broker.log
          retention-days: 7

  # BitPacker conformance: every generator target encodes the fixtures
  # byte-identically and rejects hostile input. Targets whose toolchain the
  # runner lacks report SKIP; the per-driver jobs above cover the rest.
  bitpacker:
    name: BitPacker cross-language conformance
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - name: Extra toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev lua5.4 ghc ocaml ocaml-findlib erlang-nox elixir ldc nim crystal
          echo "GHC=/usr/bin/ghc" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@v1
      - name: run_all.sh
        run: bash tools/bit-packer/cross_lang_test/run_all.sh

  # Chaos is slower and deliberately randomised, so it runs on demand and on
  # main rather than on every pull request.
  chaos:
    name: Chaos run
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build binaries
        run: cargo build -p brahmaputra-server -p brahmaputra-cli
      - name: Chaos
        run: bash scripts/verify-chaos.sh
        env:
          ROUNDS: 8

  # Benchmarks vs Kafka. Not a pass/fail gate — hardware varies too much
  # between runners for a threshold to mean anything — but the report is
  # published so a regression is visible in the run's artifacts.
  benchmark:
    name: Benchmark vs Kafka
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Small-record benchmark
        run: bash scripts/bench-vs-kafka.sh
        env:
          RECORDS: 200000

      - name: 1 MiB three-way benchmark
        run: bash scripts/bench-three-way.sh
        env:
          RECORDS: 500

      - name: Publish reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: bench/results/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo '## Benchmark results'
            cat bench/results/report.md 2>/dev/null || true
            cat bench/results/three-way.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
