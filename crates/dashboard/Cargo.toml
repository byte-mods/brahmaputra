[package]
name = "brahmaputra-dashboard"
description = "Embedded metrics/admin HTTP API, RBAC login and operations dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
brahmaputra-broker.workspace = true
brahmaputra-client.workspace = true
brahmaputra-metadata.workspace = true
brahmaputra-metrics.workspace = true
brahmaputra-protocol.workspace = true
async-stream = "0.3"
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
argon2 = { version = "0.5", features = ["password-hash"] }
rand_core = { version = "0.6", features = ["getrandom"] }
async-trait = "0.1"
jsonwebtoken = "9"

[dev-dependencies]
tempfile.workspace = true
