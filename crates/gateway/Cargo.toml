[package]
name = "brahmaputra-ws-gateway"
description = "Stateless WebSocket gateway: authenticated client streams into Brahmaputra topics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "brahmaputra-ws-gateway"
path = "src/main.rs"

[[bin]]
name = "ws-loadgen"
path = "src/bin/ws-loadgen.rs"

[dependencies]
brahmaputra-client.workspace = true
brahmaputra-protocol.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["env"] }
futures.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rcgen.workspace = true
brahmaputra-broker.workspace = true
brahmaputra-metrics.workspace = true
tempfile.workspace = true
