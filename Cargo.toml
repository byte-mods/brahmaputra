[workspace]
resolver = "2"
# Controller and metadata are M2 members; the controller embeds OpenRaft.
# Later milestones may add the dedicated testing support described in DESIGN.md §10.
members = [
    "crates/protocol",
    "crates/storage",
    "crates/metrics",
    "crates/dashboard",
    "crates/metadata",
    "crates/controller",
    "crates/broker",
    "crates/client",
    "crates/server",
    "crates/cli",
    "crates/gateway",
]

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "Apache-2.0"

# Crate selection follows DESIGN.md §9.
[workspace.dependencies]
bytes = "1"
crc32c = "0.6"
lz4_flex = "0.11"
# The remaining codecs Kafka offers. lz4 stays the default: it is the best
# ratio-per-CPU for the streaming case, and zstd/gzip trade throughput for
# size on cold or bandwidth-bound topics.
zstd = "0.13"
snap = "1"
flate2 = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
    "io-util",
] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
axum = "0.8"
openraft = { version = "=0.9.21", features = ["serde"] }
redb = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# QUIC transport (DESIGN.md §6): an alternative to the TCP data plane,
# carrying the same BitPacker frames over per-request bidirectional streams.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"

# WebSocket gateway (crates/gateway).
tokio-tungstenite = "0.28"
base64 = "0.22"
ring = "0.17"

# dev-dependencies
tempfile = "3"

brahmaputra-protocol = { path = "crates/protocol", version = "0.8.0" }
brahmaputra-storage = { path = "crates/storage", version = "0.8.0" }
brahmaputra-metadata = { path = "crates/metadata", version = "0.8.0" }
brahmaputra-metrics = { path = "crates/metrics", version = "0.8.0" }
brahmaputra-dashboard = { path = "crates/dashboard", version = "0.8.0" }
brahmaputra-controller = { path = "crates/controller", version = "0.8.0" }
brahmaputra-broker = { path = "crates/broker", version = "0.8.0" }
brahmaputra-client = { path = "crates/client", version = "0.8.0" }
